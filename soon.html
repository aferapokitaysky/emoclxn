<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
        if (window.self !== window.top) {
            document.documentElement.classList.add('embedded');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMO CLXN — Coming Soon</title>
    <link rel="icon" href="./assets/image.png" type="image/png">
    
    <!-- Google Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@700;800&family=Fira+Code:wght@400;500;600&family=Chakra+Petch:wght@400;500;600;700&family=UnifrakturMaguntia&family=Orbitron:wght@500;700;900&family=Pirata+One&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #000000;
            --accent-cyan: #00f3ff;
            --text-color: #ffffff;
            --muted-text: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(0, 243, 255, 0.15);

            /* Font Families System */
            --font-main: 'Outfit', sans-serif;
            --font-display: 'Chakra Petch', 'Syne', sans-serif;
            --font-code: 'JetBrains Mono', 'Fira Code', monospace;
            --font-gothic: 'Pirata One', 'UnifrakturMaguntia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none; /* Hide default cursor to use LERP custom target */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Enable 3D perspective */
        }

        .embedded body {
            background: transparent !important;
            background-color: transparent !important;
        }

        /* Scanline & Noise CRT overlays */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 99;
            opacity: 0.45;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
            z-index: 98;
        }

        /* Ambient glowing background */
        .radial-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Interactive 3D Card */
        .tilt-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            padding: 40px;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            transform: translateZ(50px); /* Lift logos in 3D */
            margin-bottom: 50px;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.15));
            transition: filter 0.3s ease;
        }

        .logo-wrapper:hover {
            filter: drop-shadow(0 0 35px rgba(0, 243, 255, 0.3));
        }

        .logo-emo {
            height: 160px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .logo-gta {
            height: 145px;
            width: auto;
            object-fit: contain;
            display: block;
            mix-blend-mode: screen; /* Instantly crop black background */
        }

        /* Vertical Divider Line */
        .divider {
            width: 2px;
            height: 120px;
            background: linear-gradient(to bottom, transparent, var(--accent-cyan), transparent);
            box-shadow: 0 0 15px var(--accent-cyan), 0 0 30px var(--accent-cyan);
            opacity: 0.8;
            animation: dividerGlow 2s ease-in-out infinite alternate;
        }

        /* 3D Liquid Chrome Gothic Text */
        .soon-text-container {
            transform: translateZ(80px); /* Higher 3D lift for depth */
            margin-top: 20px;
            text-align: center;
        }

        .soon-text {
            font-family: var(--font-gothic);
            font-size: 5rem;
            color: #ffffff;
            text-transform: lowercase;
            letter-spacing: 0.15em;
            display: inline-block;
            position: relative;
            text-shadow: 
                0 0 8px rgba(0, 243, 255, 0.4),
                0 1px 0 #e0e0e0,
                0 2px 0 #cccccc,
                0 3px 0 #b8b8b8,
                0 4px 0 #a3a3a3,
                0 5px 0 #8e8e8e,
                0 6px 8px rgba(0, 0, 0, 0.6);
            animation: floatText 4s ease-in-out infinite alternate;
        }

        /* Custom LERP Custom Cursor */
        .custom-cursor-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 0 10px var(--accent-cyan), 0 0 20px var(--accent-cyan);
        }

        .custom-cursor-circle {
            width: 28px;
            height: 28px;
            border: 1.5px solid var(--accent-cyan);
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 999;
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }

        /* Action back button */
        .back-btn-container {
            margin-top: 40px;
            transform: translateZ(40px);
        }

        .back-btn {
            background: rgba(0, 243, 255, 0.03);
            color: var(--text-color);
            border: 1px solid rgba(0, 243, 255, 0.25);
            padding: 12px 28px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.05);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* Animations */
        @keyframes dividerGlow {
            from {
                height: 80px;
                opacity: 0.6;
                box-shadow: 0 0 10px var(--accent-cyan);
            }
            to {
                height: 100px;
                opacity: 1;
                box-shadow: 0 0 25px var(--accent-cyan), 0 0 45px var(--accent-cyan);
            }
        }

        @keyframes floatText {
            from {
                transform: translateY(0) rotate(0deg);
                text-shadow: 
                    0 0 8px rgba(0, 243, 255, 0.4),
                    0 1px 0 #e0e0e0,
                    0 2px 0 #cccccc,
                    0 3px 0 #b8b8b8,
                    0 4px 0 #a3a3a3,
                    0 5px 0 #8e8e8e,
                    0 6px 8px rgba(0, 0, 0, 0.6);
            }
            to {
                transform: translateY(-8px) rotate(-1deg);
                text-shadow: 
                    0 0 18px rgba(0, 243, 255, 0.7),
                    0 1px 0 #ffffff,
                    0 2px 0 #f0f0f0,
                    0 3px 0 #d9d9d9,
                    0 4px 0 #c4c4c4,
                    0 5px 0 #b0b0b0,
                    0 10px 15px rgba(0, 0, 0, 0.8);
            }
        }

        /* Responsive scaling */
        @media (max-width: 768px) {
            .logo-row {
                gap: 25px;
            }
            .logo-emo {
                height: 80px;
            }
            .logo-gta {
                height: 75px;
            }
            .divider {
                height: 60px;
            }
            .soon-text {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- CRT Visual Overlays -->
    <div class="scanlines"></div>
    <div class="noise-overlay"></div>
    <div class="radial-glow"></div>

    <!-- 3D Parallax Container -->
    <div class="tilt-container" id="tiltContainer">
        
        <!-- Symmetrical Logos Row -->
        <div class="logo-row">
            <div class="logo-wrapper">
                <img src="./assets/image.png" alt="EMO Logo" class="logo-emo">
            </div>
            
            <div class="divider"></div>
            
            <div class="logo-wrapper">
                <img src="./assets/gta5rp.png" alt="GTA5 RP Logo" class="logo-gta">
            </div>
        </div>
        
        <!-- Metallic Gothic soon.. -->
        <div class="soon-text-container">
            <h1 class="soon-text">soon..</h1>
        </div>

        <!-- Back Button -->
        <div class="back-btn-container">
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 12px; height: 12px;">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Вернуться назад
            </a>
        </div>
        
    </div>

    <!-- High-Tech Custom Target Cursor -->
    <div class="custom-cursor-dot" id="cursorDot"></div>
    <div class="custom-cursor-circle" id="cursorCircle"></div>

    <script>
        // Check if running inside an iframe
        if (window.self !== window.top) {
            document.addEventListener('DOMContentLoaded', () => {
                const backBtn = document.querySelector('.back-btn-container');
                const curDot = document.getElementById('cursorDot');
                const curCirc = document.getElementById('cursorCircle');
                if (backBtn) backBtn.style.display = 'none';
                if (curDot) curDot.style.display = 'none';
                if (curCirc) curCirc.style.display = 'none';
                
                // Adjust card styling when embedded inside the iframe
                document.body.style.background = 'transparent';
                document.body.style.cursor = 'none';
                const tiltCont = document.getElementById('tiltContainer');
                if (tiltCont) {
                    tiltCont.style.padding = '10px';
                }
            });
        }

        // Custom LERP Cursor Logic
        const cursorDot = document.getElementById('cursorDot');
        const cursorCircle = document.getElementById('cursorCircle');
        
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let dotX = mouseX;
        let dotY = mouseY;
        let circleX = mouseX;
        let circleY = mouseY;
        
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Hover expand cursor effect
        const interactiveElements = document.querySelectorAll('a, button, .logo-wrapper');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursorCircle.style.width = '42px';
                cursorCircle.style.height = '42px';
                cursorCircle.style.backgroundColor = 'rgba(0, 243, 255, 0.08)';
            });
            el.addEventListener('mouseleave', () => {
                cursorCircle.style.width = '28px';
                cursorCircle.style.height = '28px';
                cursorCircle.style.backgroundColor = 'transparent';
            });
        });

        // LERP loop
        function updateCursor() {
            // Instant dot
            dotX += (mouseX - dotX) * 0.3;
            dotY += (mouseY - dotY) * 0.3;
            
            // Slow lag circle
            circleX += (mouseX - circleX) * 0.12;
            circleY += (mouseY - circleY) * 0.12;
            
            cursorDot.style.left = `${dotX}px`;
            cursorDot.style.top = `${dotY}px`;
            
            cursorCircle.style.left = `${circleX}px`;
            cursorCircle.style.top = `${circleY}px`;
            
            requestAnimationFrame(updateCursor);
        }
        updateCursor();

        // 3D Parallax Tilt Effect
        const tiltContainer = document.getElementById('tiltContainer');
        const maxTilt = 15; // Max angle in degrees
        
        window.addEventListener('mousemove', (e) => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Calculate cursor offset from center (-1 to 1)
            const xVal = (e.clientX - width / 2) / (width / 2);
            const yVal = (e.clientY - height / 2) / (height / 2);
            
            // Rotate card accordingly (invert Y for natural tilt)
            const rotateX = (-yVal * maxTilt).toFixed(2);
            const rotateY = (xVal * maxTilt).toFixed(2);
            
            tiltContainer.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        
        // Listen for parent page mouse coordinates for cross-frame 3D tilt tracking
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'mousemove') {
                if (e.data.isHovered) {
                    const rotateX = (-e.data.relativeY * maxTilt).toFixed(2);
                    const rotateY = (e.data.relativeX * maxTilt).toFixed(2);
                    
                    if (tiltContainer) {
                        tiltContainer.style.transition = 'transform 0.1s ease-out';
                        tiltContainer.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
                    }
                } else {
                    // Reset tilt smoothly when cursor moves away
                    if (tiltContainer) {
                        tiltContainer.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                        tiltContainer.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
                    }
                }
            }
        });
        
        // Reset tilt on leave (standalone page mode)
        window.addEventListener('mouseleave', () => {
            if (tiltContainer) {
                tiltContainer.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                tiltContainer.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
            }
        });
    </script>
</body>
</html>
